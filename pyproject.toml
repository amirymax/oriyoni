[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*", ".venv", "frontend"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "DJ",  # flake8-django
    "C4",  # comprehensions
]

[tool.ruff.lint.isort]
known-first-party = [
    "accounts",
    "cart",
    "catalog",
    "config",
    "core",
    "dashboard",
    "engagement",
    "orders",
    "wishlist",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "--reuse-db --strict-markers"
markers = [
    "seeded: keep the catalogue the seed migration created instead of emptying it",
]
filterwarnings = [
    # WhiteNoise warns that STATIC_ROOT is missing. collectstatic builds it at
    # deploy time; the suite serves no static files and does not need it.
    "ignore:No directory at:UserWarning",
]
