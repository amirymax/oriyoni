# nginx site serving both halves of ORIYONI from one origin.
# Install to /etc/nginx/sites-available/oriyoni.
#
# One origin rather than two hostnames is deliberate: the storefront's auth
# cookies then never cross a site boundary, so CORS does not apply and the
# strict SameSite=Lax default keeps working. Path decides which app answers.
server {
    # default_server also answers requests arriving by bare IP, which is how
    # the site is reachable before DNS is pointed here. Requires
    # /etc/nginx/sites-enabled/default to be removed.
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name oriyoni.shop www.oriyoni.shop;

    # Product photos are uploaded through the admin; the 1M default is too small.
    client_max_body_size 20M;

    # Set once at server level so every location inherits them. Adding a
    # proxy_set_header inside a location would silently discard all of these,
    # so keep them here.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Django trusts this to decide whether the original request was HTTPS.
    # Without it every request looks like plain http and SECURE_SSL_REDIRECT
    # sends the browser into a redirect loop.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    # ---- Django ----------------------------------------------------------
    # Uploaded media is served straight off disk; it never needs to wake Python.
    location /media/ {
        alias /srv/oriyoni/media/;
        access_log off;
        expires 30d;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
    }

    # Django's own admin, moved off /admin so the storefront's staff panel
    # can live there. Both wanted the same path and nginx gave it to Django,
    # which made the panel unreachable.
    location /django-admin/ {
        proxy_pass http://127.0.0.1:8000;
    }

    # Django's own static files (the admin's CSS), served by WhiteNoise.
    # Distinct from Next.js assets, which live under /_next/.
    location /static/ {
        proxy_pass http://127.0.0.1:8000;
    }

    # ---- Next.js ---------------------------------------------------------
    # Everything else is the storefront.
    location / {
        proxy_pass http://127.0.0.1:3000;
        # Next.js needs these for HMR-style streaming and server actions.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
