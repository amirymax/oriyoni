# Tests every push, and deploys main to the server when they pass.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  # Lets a deploy be re-run from the Actions tab without an empty commit.
  workflow_dispatch:

concurrency:
  # Two deploys racing on one server would interleave a git reset with an npm
  # build. Newer wins; the older is cancelled before it can start.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Backend and storefront checks are independent, so they run side by side
  # rather than one after the other — the storefront build is free wall-clock
  # time while the Django suite runs.
  backend:
    name: Backend (py${{ matrix.python }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 3.12 is what a local checkout gets from the README; 3.14 is what
        # Ubuntu 26.04 ships and what the server's venv is built on. Testing
        # only one of them means the suite passing says nothing about the
        # interpreter production actually runs. Both run in parallel, so this
        # costs no wall-clock time.
        python: ["3.12", "3.14"]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: oriyoni
          POSTGRES_USER: oriyoni
          POSTGRES_PASSWORD: oriyoni
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      - run: pip install -r requirements/dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        env:
          DATABASE_URL: postgres://oriyoni:oriyoni@localhost:5432/oriyoni
        run: pytest -q

  frontend:
    name: Storefront
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        # Catches type errors here rather than on the server, so a doomed
        # deploy never starts.
        run: npm ci --no-audit --no-fund && npm run build
        working-directory: frontend

  deploy:
    name: Deploy to server
    needs: [backend, frontend]
    # Only main, and never from a pull request — a PR from a fork would
    # otherwise be able to run code against the production server.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run the deploy script over SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
        # The script is piped from this checkout rather than run from a path on
        # the server. It lives in the repo, so expecting it to already be there
        # is circular — the very first deploy, and any deploy after the script
        # is renamed, would fail on a server whose tree predates it. Piping also
        # guarantees the script that runs is the one from the commit being
        # deployed.
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              "deploy@$HOST" "bash -s" < deploy/deploy.sh
