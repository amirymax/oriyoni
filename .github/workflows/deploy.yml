# Tests every push, and deploys main to the server when they pass.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  # Lets a deploy be re-run from the Actions tab without an empty commit.
  workflow_dispatch:

concurrency:
  # Two deploys racing on one server would interleave a git reset with an npm
  # build. Newer wins; the older is cancelled before it can start.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: oriyoni
          POSTGRES_USER: oriyoni
          POSTGRES_PASSWORD: oriyoni
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements/dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Backend tests
        env:
          DATABASE_URL: postgres://oriyoni:oriyoni@localhost:5432/oriyoni
        run: pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Storefront build
        # Catches type errors and broken imports here rather than on the server,
        # where a failed build would mean a half-finished deploy.
        run: npm ci --no-audit --no-fund && npm run build
        working-directory: frontend

  deploy:
    name: Deploy to server
    needs: test
    # Only main, and never from a pull request — a PR from a fork would
    # otherwise be able to run code against the production server.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Run the deploy script over SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              "deploy@$HOST" "bash /srv/oriyoni/deploy/deploy.sh"
